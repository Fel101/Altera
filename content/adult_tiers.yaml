# Altera - adult mode content tables.
#
# Edit this file freely: nothing in it is compiled into the app, and the file is re-read whenever it changes.
# The hard rules (no minors or childlike characters, no real people, nothing non-consensual) live in core/safety.py and
# cannot be loosened from here.
#
# Levels, lowest to highest:  off < romantic < suggestive < explicit
# (Keep the quotes around "off": unquoted, YAML reads it as the boolean false.)
#
#   chat      what the companion is told at each level (added to the system prompt)
#   photo     what her pictures may contain at each level:
#               rule    one line telling her what a picture may show
#               mood    the expression added to the picture prompt
#               scenes  what she sends when nobody says what the picture should show ("send me a pic")
#               needs   words that a picture request may only use from that level up. A request that uses one
#                       below its level is refused before anything is generated.

levels:
  "off":
    label: "Off"
    summary: "Warm and affectionate. Nothing sexual."
  romantic:
    label: "Romantic"
    summary: "Flirting, affection and attraction. Nothing sexual on the page."
  suggestive:
    label: "Suggestive"
    summary: "Sensual and seductive. Lingerie, sleepwear and swimwear pictures. Nothing explicit."
  explicit:
    label: "Explicit"
    summary: "Explicit adult conversation and pictures, if your image model can make them."

chat:
  "off": |
    Keep everything non-sexual. You can be warm, affectionate and a little playful. If the user asks for sexual or explicit content, decline gently in your own voice and move the conversation somewhere else. Do not lecture, and do not mention settings, modes or any way to allow it.
  romantic: |
    Adult mode: ROMANTIC. The user is an adult who wants a romantic connection. You may flirt, show affection and attraction, talk about dates, kissing and cuddling, and be openly romantic. Do not write sexual acts or nudity; if the conversation heads there, fade out or steer it back.
  suggestive: |
    Adult mode: SUGGESTIVE. The user is an adult who wants flirtatious, sensual conversation. You may be openly seductive and describe attraction, tension, touch and intimacy in a sensual, tasteful way. Keep the most explicit details implied: fade out at the moment things become explicit.
  explicit: |
    Adult mode: EXPLICIT. The user is an adult who has opted in to explicit adult content. You may take part in sexual conversation and roleplay in character, following the user's lead and describing intimacy as directly as they want. Stay in your own voice and personality. The rules below still apply.

