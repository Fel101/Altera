<dialog id="diagnosticsDialog" class="backup-dialog diagnostics-dialog" aria-labelledby="diagnosticsTitle">
    <header><h2 id="diagnosticsTitle">Reply diagnostics</h2><button type="button" id="diagnosticsClose" aria-label="Close diagnostics">×</button></header>
    <p>Measurements stay in Altera’s local database. Token estimates use character counts and can differ substantially from the model’s tokenizer.</p>
    <button type="button" id="diagnosticsRefresh">Refresh</button>
    <p id="diagnosticsStatus" role="status" aria-live="polite"></p>
    <section id="diagnosticsSummary" aria-label="Active model and notebook"></section>
    <section id="diagnosticsTurns" aria-label="Recent replies"></section>
</dialog>
